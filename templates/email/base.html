<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, Helvetica, sans-serif; }
    .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; }
    .header { background-color: #012657; padding: 24px; text-align: center; }
    .header img { max-height: 48px; }
    .header h1 { color: #ffffff; font-size: 24px; margin: 12px 0 0; }
    .content { padding: 32px 24px; color: #333333; line-height: 1.6; }
    .content h2 { color: #012657; margin-top: 0; }
    .btn { display: inline-block; background-color: #BE5103; color: #ffffff; padding: 12px 32px; text-decoration: none; border-radius: 4px; font-weight: bold; margin: 16px 0; }
    .footer { background-color: #D9D9D9; padding: 16px 24px; text-align: center; font-size: 12px; color: #666666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Athlete2Work</h1>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>&copy; {{ year }} Athlete2Work. Todos los derechos reservados.</p>
    </div>
  </div>
</body>
</html>
